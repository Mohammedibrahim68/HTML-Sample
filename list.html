<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <h2>example for html list</h2>
     <!-- ordered list-->
    <ol type="I">
    <li>apple</li>
    <li>mango</li>
    <li>banana</li>
    <li>orange</li>
    </ol>
    <ul>
    <!-- unordered list-->
     <li>apple</li>
     <li>mango</li>
     <li>banana</li>
     <li>orange</li>
    </ul>
    <!-- definition list-->
     <dl>
        <dt>js</dt>
        <dd>javascript</dd>
        <dt>js</dt>
        <dd>javascript</dd>
        
     </dl>

</body>
</html>
